<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso ao Sistema - CRCAL</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-hover: #172554;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #cbd5e1;
      --danger: #dc2626;
      --success: #15803d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .login-card {
      background: var(--card);
      width: 100%;
      max-width: 400px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    .login-header {
      background: var(--primary);
      color: #fff;
      padding: 1.5rem;
      text-align: center;
    }

    .login-header h1 {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .login-body {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .login-body[hidden] {
      display: none;
    }

    .login-sub {
      font-size: 0.875rem;
      color: var(--muted);
      line-height: 1.4;
    }

    .login-field {
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
    }

    .login-field label {
      font-size: 0.875rem;
      font-weight: 600;
    }

    .login-field input {
      padding: 0.625rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .login-field input:focus {
      border-color: var(--primary);
    }

    .login-err {
      font-size: 0.85rem;
      color: var(--danger);
      min-height: 1.2em;
    }

    .login-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .login-btn:hover {
      background: var(--primary-hover);
    }

    .login-link {
      background: none;
      border: none;
      color: var(--primary);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <main class="login-card">
    <header class="login-header">
      <h1>Acesso Restrito</h1>
    </header>

    <!-- Formulário de Login -->
    <form class="login-body" id="login-form">
      <p class="login-sub">Insira suas credenciais para acessar o painel.</p>
      <div class="login-field">
        <label for="login-user">Usuário</label>
        <input type="text" id="login-user" placeholder="Digite seu usuário" required autocomplete="username">
      </div>
      <div class="login-field">
        <label for="login-pass">Senha</label>
        <input type="password" id="login-pass" placeholder="Digite sua senha" required autocomplete="current-password">
      </div>
      <p class="login-err" id="login-err" role="alert"></p>
      <button type="submit" class="login-btn">Entrar</button>
      <button type="button" class="login-link" id="btn-forgot-pass">Esqueci minha senha</button>
    </form>

    <!-- Formulário de Redefinição de Senha -->
    <form class="login-body" id="reset-form" hidden>
      <p class="login-sub">Informe seu usuário, celular (apenas números) e defina uma nova senha.</p>
      <div class="login-field">
        <label for="reset-user">Usuário</label>
        <input type="text" id="reset-user" placeholder="Digite seu usuário" required autocomplete="username">
      </div>
      <div class="login-field">
        <label for="reset-phone">Celular (sem pontuação)</label>
        <input type="tel" id="reset-phone" placeholder="Ex: 82999999999" inputmode="numeric" pattern="[0-9]*" maxlength="11" required>
      </div>
      <div class="login-field">
        <label for="reset-pass">Nova senha</label>
        <input type="password" id="reset-pass" placeholder="Mínimo 4 caracteres" required autocomplete="new-password">
      </div>
      <div class="login-field">
        <label for="reset-pass2">Confirmar nova senha</label>
        <input type="password" id="reset-pass2" placeholder="Repita a nova senha" required autocomplete="new-password">
      </div>
      <p class="login-err" id="reset-err" role="alert"></p>
      <button type="submit" class="login-btn">Salvar nova senha</button>
      <button type="button" class="login-link" id="btn-back-login">Voltar para o login</button>
    </form>
  </main>

  <script>
    // Cadastro base com os celulares sem pontuação
    const USERS_DB = {
      vinicius: { pass: "1234", phone: "82996947176" },
      greta: { pass: "1234", phone: "82988059840" }
    };

    // Recupera senhas salvas localmente (caso já tenham sido alteradas antes)
    const savedUsers = JSON.parse(localStorage.getItem("crcal_users") || "null") || USERS_DB;

    const loginForm = document.getElementById("login-form");
    const loginErr = document.getElementById("login-err");
    const resetForm = document.getElementById("reset-form");
    const resetPhoneInput = document.getElementById("reset-phone");
    const resetErr = document.getElementById("reset-err");

    // Alternar entre Login e Redefinição de Senha
    document.getElementById("btn-forgot-pass").addEventListener("click", () => {
      loginForm.hidden = true;
      resetForm.hidden = false;
      loginErr.textContent = "";
      resetErr.textContent = "";
    });

    document.getElementById("btn-back-login").addEventListener("click", () => {
      resetForm.hidden = true;
      loginForm.hidden = false;
      resetErr.textContent = "";
      loginErr.textContent = "";
    });

    // Impede digitação de pontos, traços ou espaços em tempo real
    resetPhoneInput.addEventListener("input", () => {
      resetPhoneInput.value = resetPhoneInput.value.replace(/\D/g, "");
    });

    // Validação do Login
    loginForm.addEventListener("submit", (e) => {
      e.preventDefault();
      loginErr.style.color = "var(--danger)";
      loginErr.textContent = "";

      const user = document.getElementById("login-user").value.trim().toLowerCase();
      const pass = document.getElementById("login-pass").value;

      if (!savedUsers[user] || savedUsers[user].pass !== pass) {
        loginErr.textContent = "Usuário ou senha inválidos.";
        return;
      }

      // Salva um aviso de que o usuário está logado
      sessionStorage.setItem("usuario_logado", user);

      loginErr.style.color = "var(--success)";
      loginErr.textContent = "Login realizado com sucesso! Redirecionando...";

      // Manda para a página da central (troque pelo nome exato do seu arquivo)
      window.location.href = "central.html";
    });

    // Validação da Redefinição de Senha
    resetForm.addEventListener("submit", (e) => {
      e.preventDefault();
      resetErr.textContent = "";

      const user = document.getElementById("reset-user").value.trim().toLowerCase();
      const phone = resetPhoneInput.value.trim();
      const pass1 = document.getElementById("reset-pass").value;
      const pass2 = document.getElementById("reset-pass2").value;

      // 1. Verifica se o usuário existe
      if (!savedUsers[user]) {
        resetErr.textContent = "Usuário não encontrado.";
        return;
      }

      // 2. Valida se o celular corresponde ao usuário informado
      if (savedUsers[user].phone !== phone) {
        resetErr.textContent = "Número de celular incorreto para este usuário.";
        return;
      }

      // 3. Valida tamanho e confirmação da nova senha
      if (pass1.length < 4) {
        resetErr.textContent = "A nova senha deve ter no mínimo 4 caracteres.";
        return;
      }

      if (pass1 !== pass2) {
        resetErr.textContent = "As senhas não coincidem.";
        return;
      }

      // 4. Salva a nova senha e retorna para a tela de login
      savedUsers[user].pass = pass1;
      localStorage.setItem("crcal_users", JSON.stringify(savedUsers));

      resetForm.reset();
      resetForm.hidden = true;
      loginForm.hidden = false;
      loginErr.style.color = "var(--success)";
      loginErr.textContent = "Senha alterada com sucesso! Faça login.";
    });
  </script>
</body>
</html>
